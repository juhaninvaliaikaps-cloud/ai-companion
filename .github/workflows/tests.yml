name: Tests

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      testMode:
        description: 'Test mode. editmode is the CI default; playmode needs a display and is usually local.'
        required: false
        default: editmode
        type: choice
        options:
          - editmode
          - playmode
          - all

permissions:
  contents: read
  checks: write
  actions: write

# Unity Personal has one seat for CI. A second workflow must wait until this
# one has returned it. Cancelling mid-run can skip that return.
concurrency:
  group: unity-personal-license
  cancel-in-progress: false

jobs:
  unity-tests:
    name: EditMode and PlayMode tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check Unity license secrets
        id: license
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          missing=()
          if [ -z "$UNITY_EMAIL" ]; then missing+=("UNITY_EMAIL"); fi
          if [ -z "$UNITY_PASSWORD" ]; then missing+=("UNITY_PASSWORD"); fi
          if [ ${#missing[@]} -gt 0 ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice title=Unity tests skipped::Missing GitHub Actions secrets: ${missing[*]}. Add UNITY_EMAIL and UNITY_PASSWORD. Steps are in TESTING.md. This job succeeds so the check is not red before those secrets exist."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.license.outputs.skip != 'true'
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Cache Library
        if: steps.license.outputs.skip != 'true'
        uses: actions/cache@v4
        with:
          path: Library
          # The player build job caches a Windows Library. Restoring that into this Linux
          # container made Unity convert it and the process was killed (exit 137, out of
          # memory), so the test cache gets its own key prefix.
          key: Library-tests-6000.6.6f1-${{ hashFiles('Packages/manifest.json', 'Packages/packages-lock.json', 'ProjectSettings/ProjectVersion.txt') }}
          restore-keys: |
            Library-tests-6000.6.6f1-

      - name: Run Unity tests
        if: steps.license.outputs.skip != 'true'
        id: tests
        # A killed container is a runner crash, not a test failure. Let the next
        # step retry once before the job goes red.
        continue-on-error: true
        uses: game-ci/unity-test-runner@v4.4.0
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          # Unity 6 Personal on an ephemeral runner. game-ci/cli v0.1.63+
          # (measured on 6000.6) activates from the account. A .ulf is bound
          # to the machine that created it, so UNITY_LICENSE is not passed.
          GAME_CI_UNITY_LICENSING_METHOD: personal
          # unity-test-runner v4.4.0 turns coverageEnabled: false into
          # --no-coverageEnabled. game-ci CLI v0.1.72 sets negation-prefix
          # off, treats that as an unknown argument, and exits before Docker
          # starts. GAME_CI_* is the CLI's own option override.
          GAME_CI_COVERAGE_ENABLED: "false"
          # Pins below avoid the unauthenticated "latest" lookup, which 403s
          # when the runner IP is rate-limited. The token covers that lookup
          # if the pin is removed.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          unityVersion: 6000.6.6f1
          customImage: unityci/editor:ubuntu-6000.6.6f1-base-3
          # playmode, then editmode, in this container, after one activation.
          # The action returns the Personal seat when the step ends.
          # PlayMode produced no results file inside the container (no display), which made
          # the whole job red even though all 457 EditMode tests passed. CI runs EditMode;
          # PlayMode runs locally, or manually through workflow_dispatch.
          testMode: ${{ inputs.testMode || 'editmode' }}
          # EditMode does not need a graphics device. The container defaults to software
          # OpenGL (llvmpipe), and the editor was killed with exit 137 while reloading Mono
          # assemblies under that memory pressure.
          customParameters: '-nographics'
          cliVersion: v0.1.72
          # Explicit empty: the input defaults to the job token, and with it the action
          # creates a second check run with this name that stays neutral, so the PR showed
          # NEUTRAL even when the job passed. The env token above still covers rate limits.
          githubToken: ''
          checkName: EditMode and PlayMode tests

      # The runner is killed intermittently with exit 137 or "Unable to find
      # image" before Unity produces a test result. One automatic retry avoids
      # burning a new push or a manual rerun for that infrastructure failure.
      - name: Retry Unity tests after a runner crash
        if: steps.license.outputs.skip != 'true' && steps.tests.outcome == 'failure'
        id: tests_retry
        uses: game-ci/unity-test-runner@v4.4.0
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          GAME_CI_UNITY_LICENSING_METHOD: personal
          GAME_CI_COVERAGE_ENABLED: "false"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          unityVersion: 6000.6.6f1
          customImage: unityci/editor:ubuntu-6000.6.6f1-base-3
          testMode: ${{ inputs.testMode || 'editmode' }}
          customParameters: '-nographics'
          cliVersion: v0.1.72
          githubToken: ''
          checkName: EditMode and PlayMode tests

      - name: Upload test results
        if: always() && steps.license.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Test results
          # Use the successful attempt's artifacts; if the first attempt crashed,
          # fall back to the retry's output.
          path: ${{ steps.tests.outputs.artifactsPath || steps.tests_retry.outputs.artifactsPath }}
          if-no-files-found: ignore

  # Starts only after unity-tests finishes, so the two jobs never hold the
  # Personal seat at the same time. EditMode on the Linux editor defines
  # UNITY_EDITOR and does not compile UNITY_STANDALONE_WIN && !UNITY_EDITOR.
  windows-player-compile:
    name: Windows player script compile
    needs: unity-tests
    if: always() && needs.unity-tests.result != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check Unity license secrets
        id: license
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          missing=()
          if [ -z "$UNITY_EMAIL" ]; then missing+=("UNITY_EMAIL"); fi
          if [ -z "$UNITY_PASSWORD" ]; then missing+=("UNITY_PASSWORD"); fi
          if [ ${#missing[@]} -gt 0 ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice title=Windows player compile skipped::Missing GitHub Actions secrets: ${missing[*]}. Add UNITY_EMAIL and UNITY_PASSWORD. Steps are in TESTING.md. This job succeeds so the check is not red before those secrets exist."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.license.outputs.skip != 'true'
        uses: actions/checkout@v4
        with:
          lfs: true

      # A restored Library killed this editor with SIGKILL 137 during the first
      # domain reload on the 16 GB runner. The same job completed on main when
      # Library was cold, so this step does not restore that cache.
      - name: Compile StandaloneWindows64 scripts
        if: steps.license.outputs.skip != 'true'
        uses: game-ci/unity-builder@v6.0.0
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          # Same Personal activation as the test job. A .ulf is not passed.
          # Credentials stay in the environment; the CLI does not take them as arguments.
          GAME_CI_UNITY_LICENSING_METHOD: personal
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          targetPlatform: StandaloneWindows64
          unityVersion: 6000.6.6f1
          customImage: unityci/editor:ubuntu-6000.6.6f1-windows-mono-3
          cliVersion: v0.1.72
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          versioning: None
          buildName: WindowsPlayerCompile
          buildsPath: build/windows-player-compile
          buildMethod: AICompanion.Editor.WindowsPlayerScriptCheck.VerifyStandaloneWindows64
